syntax = "proto3";

package datadoghq.api.metrics.v3;

option go_package = "github.com/DataDog/agent-payload/v5/metrics/intake_v3";

message Payload {
  reserved 1; // for compatibility with agentpayload.MetricPayload.series
  Metadata metadata = 2;
  MetricData metricData = 3;
}

message Metadata {
  repeated string tags = 1;
  repeated string resources = 2; // even number of elements, [Type, Name] pairs
}

message MetricData {
  // Dictionaries
  // All dictionary indexes are base-1, zero implicitly represents an empty value.
  bytes dictNameStr = 1;                // varint length + value
  bytes dictTagStr = 2;                 // varint length + value
  repeated sint64 dictTagsets = 3;      // length, delta encoded set of indexes into dictTagsStr 

  bytes dictResourceStr = 4;            // varint length + value
  repeated int64 dictResourceLen = 5;   // number of elements in Type and Name arrays
  repeated sint64 dictResourceType = 6; // delta encoded set of indexes into dictResourceStr
  repeated sint64 dictResourceName = 7; // delta encoded set of indexes into dictResourceStr

  bytes dictSourceTypeName = 8;         // varint length + value
  repeated int32 dictOriginInfo = 9;    // (product, category, service) tuples
  bytes dictUnitStr = 25;                // varint length + value

  // One entry per time series
  repeated uint64 types = 10;           // type = metricType | valueType | metricFlags
  repeated sint64 nameRefs = 11;        // index into dictNameStr, entire array is delta encoded
  repeated sint64 tagsetRefs = 12;      // index into dictTagsets, entire array is delta encoded
  repeated sint64 resourcesRefs = 13;   // index into dictResourceLen, entire array is delta encoded
  repeated uint64 intervals = 14;
  repeated uint64 numPoints = 15;
  repeated sint64 sourceTypeNameRefs = 23;  // index into dictSourceTypeName, entire array is delta encoded
  repeated sint64 originInfoRefs = 24;      // index into dictOriginInfo, entire array is delta encoded
  repeated sint64 unitRefs = 26;            // index into dictUnitStr, value present if flagHasUnit is set, entire array is delta encoded

  // each metric has numPoints values in this section
  repeated sint64 timestamps = 16;      // entire array delta encoded
  repeated sint64 valsSint64 = 17;      // or
  repeated float valsFloat32 = 18;      // or
  repeated double valsFloat64 = 19;     // based on valueType
  // Shared bin columns. DDSketch uses one key/count pair per bin; its keys are
  // independently delta encoded per point. Histograms never consume binKeys.
  // ExplicitHistogram: numBins is the number of bucket counts (B); B-1 bounds
  // follow optional Sum/Min/Max in the selected values column. B=0 denotes
  // a summary-only point (no bounds); B=1 has one count and no finite bounds.
  // ExponentialHistogram: two numBins entries per point, [positiveLength,
  // negativeLength]. binCnts contains positive counts followed by negative
  // counts, retaining zero-count buckets in each dense range.
  repeated uint64 numBins = 20;
  repeated sint32 binKeys = 21;
  repeated uint64 binCnts = 22;

  // Currently one bitmask per ExplicitHistogram or ExponentialHistogram POINT.
  // DDSketch/scalar points consume no entries. Extending this column to other
  // types requires an explicit consumption rule. Unknown bits are invalid.
  // Sum/Min/Max presence may change between points without splitting the series.
  // Missing values consume no value slots; NaN is a value, not a presence marker.
  // Count always has a valsUint64 slot.
  repeated uint32 pointFlags = 30; // pointFlags enum bitmask

  // Unsigned histogram counts, independent of valueType. Each ExplicitHistogram
  // point consumes [Count]; each ExponentialHistogram point consumes
  // [Count, zeroCount]. DDSketch/scalar points consume no entries.
  repeated uint64 valsUint64 = 31;

  // DDSketch retains the legacy layout: [Sum, Min, Max] in the selected values
  // column, then Count in valsSint64 (after the summary if valueType=Sint64).
  //
  // ExplicitHistogram has no signed integer header. Each ExponentialHistogram
  // point first consumes [scale, positiveOffset, negativeOffset] from valsSint64.
  // Both range lengths are read from numBins. Offsets and scale are signed
  // int32 values carried exactly as integers. Empty ranges may have any int32
  // offset and contribute no observations. For nonempty ranges, offset+length-1
  // must fit int32, including zero-count buckets. This is an API v3 format
  // restriction, not an OTLP requirement. Clients must drop points with
  // out-of-range bucket indices before encoding. Range element i has OTel
  // index offset+i.
  // Positive and negative ranges identify observation sign separately: negative
  // indices do NOT mean negative observations. No internal key bias or flags
  // sentinel is encoded. The receiver derives exponential bucket boundaries.
  //
  // After any signed header, read [Sum?, Min?, Max?] in that order from the column
  // selected by valueType, followed by explicit bounds or exponential
  // zero_threshold. If valueType=Sint64 these values follow the header in that
  // same column. Zero omits all numeric value slots (including bounds/threshold)
  // but never omits headers, unsigned counts or bin counts. Explicit bounds must
  // be finite and strictly increasing; zero_threshold must be finite and
  // nonnegative.
  // Compaction must preserve every boundary exactly, using Float64 when needed.
  //
  // Histogram Count and zeroCount retain their full unsigned range in valsUint64;
  // neither is converted to float or reinterpreted as signed. DDSketch Count
  // retains its legacy uint64-to-int64 bit reinterpretation in valsSint64.
  // An absent OTel sum clears pointHasSum and consumes no value slot; a present
  // zero or NaN sets pointHasSum. Preserve missing sums without dropping points
  // or substituting numeric values. Numeric-value acceptance and count-total
  // validation are separate from this transport contract.
  // DDSketch Avg is reconstructed as Sum/Count at query time.
  //
  // Example: explicit bounds [10], counts [2,3], Count=5, Sum=30, no min/max:
  //   pointFlags=[4], numBins=[2], binKeys=[], binCnts=[2,3],
  //   valueType=Sint64, valsUint64=[5], valsSint64=[30,10].
  // Example: exponential scale=0, positive(offset=0,counts=[2,0,3]),
  // negative(offset=-1,counts=[4]), zeroCount=1, threshold=0, Count=10, Sum=18:
  //   pointFlags=[4], numBins=[3,1], binKeys=[], binCnts=[2,0,3,4],
  //   valueType=Sint64, valsUint64=[10,1], valsSint64=[0,0,-1,18,0].
  // One possible population: [1.5,1.5,6,6,6,-0.75,-0.75,-0.75,-0.75,0].

}

enum metricType {
  UNUSED = 0;
  Count = 1;
  Rate = 2;
  Gauge = 3;
  DDSketch = 4;
  // Both histogram types carry delta temporality only. Clients must perform
  // cumulative-to-delta conversion before encoding; no temporality is encoded.
  ExplicitHistogram = 6;     // OTel explicit-bounds histogram
  ExponentialHistogram = 7; // OTel base-2 exponential histogram
}

enum valueType {
  Zero    = 0x00;  // value is zero, not stored explicitly
  Sint64  = 0x10;  // value is stored in valsSint64
  Float32 = 0x20;  // value is stored in valsFloat32
  Float64 = 0x30;  // value is stored in valsFloat64
}

enum metricFlags {
  flagNone    = 0;
  flagNoIndex = 0x100; // metric should not be indexed (equivalent to origin metric type == agent_hidden in v2)
  flagHasUnit = 0x200; // timeseries has a unit in the unitRefs column
}

// Point-level presence for histogram summaries. These bits are independent of
// metricFlags, which applies to a whole series in the types column.
enum pointFlags {
  pointFlagsNone = 0;
  pointHasMin = 1;
  pointHasMax = 2;
  pointHasSum = 4;
}

message Response {
  string error = 1;
}
